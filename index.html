
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Un ambiente desktop leggero, moderno e intuitivo | GreenDesk</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Ubuntu Sans', sans-serif;
      background: #f5f7f5;
      color: #222;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: white;
      padding: 40px;
      margin: 20px;
      max-width: 500px;
      text-align: center;
      border: 1px solid #e5e9e5;
      border-radius: 16px;
    }

    img {
      width: 80px;
      height: 80px;
      border-radius: 16px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    p {
      color: #666;
      line-height: 1.6;
    }

    a {
      color: #27834b;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="card">
    <img
      src="https://avatars.githubusercontent.com/u/332988574?s=96&v=4"
      alt="GreenDesk"
    >

    <h1>GreenDesk in sviluppo!</h1>

    <p>
      <a href="https://github.com/greendesktop">GitHub</a>
      · L'hosting è gentilmente fornito da
      <a href="https://eclypsegroup.com/">EclypseGroup</a>
    </p>
  </div>
</body>
</html>
